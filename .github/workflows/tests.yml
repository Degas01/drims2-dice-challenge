name: tests

# The whole point of keeping the perception and planning modules free of ROS is
# that they can be tested anywhere. So this runs on a stock Ubuntu image with
# nothing but OpenCV and NumPy -- no ROS, no MoveIt, no robot, no container.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pytest

      - name: Run the offline test suite
        run: pytest -q

      - name: Regenerate the README figures
        # Not to publish them -- to prove they still build from the current
        # code, so the pictures in the README cannot quietly go stale.
        run: python3 scripts/make_docs_images.py
