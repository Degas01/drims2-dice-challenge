# Parameters for the dice_task state machine.
dice_task:
  ros__parameters:
    target_face: 1
    strategy: auto          # auto | exact | deduce

    base_frame: base_link
    die_frame: dice_tf      # published by drims_dice_simulator
    tool_frame: tool0
    tip_frame: tip
    identification_service: dice_identification

    # UR5e home pose used by the DRIMS demo node.
    home_joints: [0.0, -1.97, 2.13, -1.83, -1.50, 0.0]

    gripper_open: 0.045
    gripper_closed: 0.0
    gripper_effort: 5.0
    # NOTE the quotes. In YAML 1.1 a bare y/n/yes/no/on/off is a *boolean*, so
    # `gripper_close_axis: y` arrives as True and ROS rejects it as the wrong
    # parameter type. Always quote single-letter axis names.
    gripper_close_axis: "y"   # which tool axis the fingers close along

    # 30 mm: what drims_dice_simulator actually spawns ("size 0.03" in its log).
    dice_size_m: 0.030
    # dice_tf is published on the die's TOP FACE, not at its centre. The
    # spawner's own log proves it: surface_height -0.020 plus size 0.030 puts
    # the centre at -0.005, but the frame arrives at +0.011 -- half a die higher.
    die_frame_on_top_face: true
    # How far the gripper leans off vertical to grasp, in degrees.
    #
    # A 90-degree flip rotates the tool by the same 90 degrees as the die, so a
    # grasp taken straight down (0) has to finish pointing horizontally -- and a
    # horizontal gripper cannot be lowered to the board, because its own body
    # gets there first. That is what MoveIt was reporting as error 99999: the
    # Cartesian planner completed 75% of the descent and stopped, right where
    # the gripper reaches the board.
    #
    # 45 splits the excursion either side of vertical: the gripper leans over
    # the die at -45 to pick it up and at +45 to set it down, and is never
    # horizontal. The fingers close along the same axis whatever the lean, so
    # they still land flat on the same two faces.
    grasp_tilt_deg: 45.0

    # 45 is the geometric optimum, not necessarily an orientation the arm can
    # hold: a six-axis arm reaching across the board has its wrist near a
    # singularity, where whole families of orientations have no IK solution.
    # That shows up as MoveIt error -31 with the arm still parked at home.
    #
    # So the node asks IK first, trying these offsets from grasp_tilt_deg in
    # order, and both wrist rolls for each. Every angle in the list keeps both
    # ends of the flip clear of horizontal; below about 32 degrees the gripper
    # starts hitting the board again on the place. Set verify_ik_before_moving
    # false to skip the check and go straight for grasp_tilt_deg.
    # Straight down (0) is always appended as the last resort: it is the
    # easiest orientation for the arm to hold and the only one certain to be
    # reachable, at the price of finishing the flip horizontal -- which means
    # the die is released from a few centimetres rather than set down.
    grasp_tilt_search_deg: [0.0, -7.0, 7.0, -13.0, 13.0]

    # Gripper envelope, used to work out how low it can go at a given angle
    # before its own body reaches the board.
    gripper_body_radius_m: 0.045
    gripper_body_offset_m: 0.05
    gripper_body_length_m: 0.10

    # Diagnostics: the arm's reach to its own flange, and the fraction at which
    # to start warning. Used to turn "-31" into a message that names the pose.
    reach_radius_m: 0.850
    reach_warn_fraction: 0.92
    tool_length_m: 0.15        # flange to fingertips; read from TF when available

    approach_height_m: 0.10
    lift_height_m: 0.12
    place_clearance_m: 0.004
    velocity_scaling: 0.3
    approach_velocity_scaling: 0.15
    max_regrasps: 8
    settle_seconds: 0.7
    attached_object_id: dice

    # --- motion execution ---------------------------------------------------
    # "moveit"     : one move_to_pose per waypoint. MoveIt plans each one to a
    #                full stop, so the arm decelerates at every corner. Safe:
    #                every motion is collision-checked against the planning scene.
    # "trajectory" : generate the Cartesian path here (LIN + SLERP + trapezoidal
    #                profile), blend the corners, solve IK per sample and send a
    #                single timed JointTrajectory -- the pipeline the DRIMS
    #                planning lecture draws. ~24% faster on a re-grasp cycle, but
    #                it bypasses MoveIt's planning-scene checks, so it is opt-in.
    #                Falls back to "moveit" automatically if IK fails anywhere or
    #                the joint path would jump branches.
    motion_mode: moveit

    blend_radius_m: 0.03        # corner rounding; 0 disables blending
    sample_dt: 0.05             # trajectory sampling period, seconds
    cartesian_v_max: 0.25       # m/s
    cartesian_a_max: 0.5        # m/s^2
    cartesian_w_max: 1.5        # rad/s
    cartesian_alpha_max: 3.0    # rad/s^2
    lateral_a_max: 2.0          # m/s^2, caps the speed through a blended corner
    max_joint_step: 0.6         # rad between samples before an IK branch flip is called
    joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
